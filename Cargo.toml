# `play`: the build to play, mod and tune with (cargo build --profile play
# -p ddplay). lift.py gen keeps address shards at opt-level 1 by default;
# --hot-functions moves sampled functions to opt-level 1 hot packages and
# builds the remaining address shards at opt-level 0. No LTO, no debug info, and
# incremental compilation so that an edit to the runtime or a mod rebuilds
# only that crate. Keep one warm target directory for it (the shards almost
# never change): after the first build, iterations take minutes.
[profile.play]
inherits = "release"
opt-level = 3
lto = "off"
debug = 0
incremental = true
codegen-units = 64

