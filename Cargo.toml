[workspace]
resolver = "2"
members = ["crates/*", "crates/ddlift/lift_*"]
# ddlift is a directory, not a package; shard manifests explicitly name this
# workspace for inherited package settings despite the excluded container.
exclude = ["crates/ddlift"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
miniz_oxide = "0.8"

# The lifted test compiles tens of thousands of machine-level functions.
# Keep backtrace line tables, without debug metadata for every local.
# See docs/tasks/L03-lifter-codegen-size.md for the measured tradeoff.
[profile.test.package.ddnative]
debug = 1

[profile.test.package.ddlift-00]
debug = 1

[profile.test.package.ddlift-01]
debug = 1

[profile.test.package.ddlift-02]
debug = 1

[profile.test.package.ddlift-03]
debug = 1

[profile.test.package.ddlift-04]
debug = 1

[profile.test.package.ddlift-05]
debug = 1

[profile.test.package.ddlift-06]
debug = 1

[profile.test.package.ddlift-07]
debug = 1

[profile.test.package.ddlift-08]
debug = 1

[profile.test.package.ddlift-09]
debug = 1

