[workspace]
resolver = "2"
members = ["crates/*", "crates/ddlift/lift_*"]
# ddlift is a directory, not a package; shard manifests explicitly name this
# workspace for inherited package settings despite the excluded container.
exclude = ["crates/ddlift"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
miniz_oxide = "0.8"

# Third-party crates (naga, wgpu, miniz_oxide, ...) optimised in dev and
# test builds: the workspace's own code keeps opt-level 0 and its debug
# info. d3d9wgsl's driver comparison went from 745 s to 52 s (one-time
# dependency build: 134 s). Cargo counts the ddlift shards as
# non-members here (crates/ddlift is excluded), so their sections below
# pin opt-level 0.
[profile.dev.package."*"]
opt-level = 2

# The lifted test compiles tens of thousands of machine-level functions.
# Keep backtrace line tables, without debug metadata for every local.
# Set on dev, which test inherits, so `cargo build` and `cargo test` share
# one build of the shards (on test alone, each built all 16 separately).
# See docs/tasks/L03-lifter-codegen-size.md for the measured tradeoff.
[profile.dev.package.ddnative]
debug = 1

[profile.dev.package.ddlift-00]
opt-level = 0
debug = 1

[profile.dev.package.ddlift-01]
opt-level = 0
debug = 1

[profile.dev.package.ddlift-02]
opt-level = 0
debug = 1

[profile.dev.package.ddlift-03]
opt-level = 0
debug = 1

