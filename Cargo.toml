# `play`: the build to play, mod and tune with (cargo build --profile play
# -p ddplay). Optimised everywhere, but cheap where it costs: the 32 lifted
# shards at opt-level 1, no link-time optimisation, no debug info, and
# incremental compilation so that an edit to the runtime or a mod rebuilds
# only that crate. Keep one warm target directory for it (the shards almost
# never change): after the first build, iterations take minutes.
[profile.play]
inherits = "release"
opt-level = 3
lto = "off"
debug = 0
incremental = true
codegen-units = 64

[profile.play.package.ddlift-00]
opt-level = 1
incremental = false

