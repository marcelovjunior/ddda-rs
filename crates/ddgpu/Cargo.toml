[package]
name = "ddgpu"
version = "0.1.0"
description = "The runtime's Direct3D 9 commands executed on wgpu"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
d3d9cmd = { path = "../d3d9cmd" }
d3d9shader = { path = "../d3d9shader" }
d3d9wgsl = { path = "../d3d9wgsl" }
wgpu = { version = "29.0.4", features = ["naga-ir"] }
naga = { version = "=29.0.4", features = ["wgsl-in", "spv-out", "serialize", "deserialize"] }
bincode = "1.3.3"
serde = { version = "1", features = ["derive"] }
wgpu-types = { version = "=29.0.4", features = ["serde"] }
blake3 = "1"

[dev-dependencies]
ash = "0.38"
# examples/pipeline_cost.rs reads the game's shader packages
mtarc = { path = "../mtarc" }
d3d9frame = { path = "../d3d9frame" }
d3d9ref = { path = "../d3d9ref" }

[[example]]
name = "module_cost"
path = "src/module_cost.rs"
