[package]
name = "ddnative-base"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
test = false

[features]
# L114: the shards inline the memory accessors and flag helpers (for
# opt-level-1 shards; at opt-level 0 the out-of-line copies compile faster)
inline-access = []

# The tests run x87 code and lifted calls: the runtime policy behind them (L74).
[dev-dependencies]
ddnative-host = { path = "../ddnative-host" }
