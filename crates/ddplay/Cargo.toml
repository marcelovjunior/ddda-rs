[package]
name = "ddplay"
version = "0.1.0"
description = "Runs the rebuilt game in a window: the runtime's session with the wgpu backend"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# L179: a faster general allocator than the Windows heap (the render
# worker spent ~12% of its time allocating per draw); off with
# --no-default-features
mimalloc = { version = "0.1", default-features = false, optional = true }
ddruntime = { path = "../ddruntime" }
ddgpu = { path = "../ddgpu" }
ddaudio = { path = "../ddaudio" }
cpal = "0.17.3"
wgpu = "29.0.4"
winit = "0.30.13"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_XboxController"] }

[features]
default = ["mimalloc"]
# the diagnostic emulator fallback (ddruntime/src/emu.rs, L51); needs CMake on PATH
emu = ["ddruntime/emu"]
