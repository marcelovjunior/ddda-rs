[package]
name = "ddaudio"
version = "0.1.0"
description = "The XAudio2 2.7 mixer: decodes, resamples and mixes the audio graph the game builds (no OS audio)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]

[target.'cfg(windows)'.dev-dependencies]
# The oracle (tests/oracle.rs) renders the same graphs on the host's XAudio2 2.9.
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_XAudio2", "Win32_System_Com", "Win32_System_LibraryLoader"] }
windows-core = "0.62.2"
