[package]
name = "hostdisplay"
version = "0.1.0"
description = "The host's display modes as its Direct3D 9 reports them (adapter 0, X8R8G8B8), for the runtime's adapter (brief L34)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D9"] }
