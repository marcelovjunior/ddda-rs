[package]
name = "ddview"
version = "0.1.0"
description = "M1 viewer: load stage cells from a Dragon's Dogma: Dark Arisen install and fly through them"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Opt-in CPU system/render spans; TRACE_CHROME selects the private output file.
# Keep disabled for acceptance timing so tracing overhead is not benchmarked.
# Release DebugName otherwise erases the function-derived system names.
profile-trace = ["bevy/trace", "bevy/debug", "dep:tracing-chrome"]

[dependencies]
tracing-chrome = { version = "0.7.2", optional = true }
mtcamera = { path = "../mtcamera" }
mtmovie = { path = "../mtmovie" }
ddpawn = { path = "../ddpawn" }
ddcombat = { path = "../ddcombat" }
mtsound = { path = "../mtsound" }
ddeconomy = { path = "../ddeconomy" }
dditem = { path = "../dditem" }
ddstory = { path = "../ddstory" }
ddlook = { path = "../ddlook" }
ddsave = { path = "../ddsave" }
bevy = "0.19.1"
ddvfs = { path = "../ddvfs" }
ddworld = { path = "../ddworld" }
ddsim = { path = "../ddsim" }
ddnet = { path = "../ddnet" }
ddhost = { path = "../ddhost" }
ddexe = { path = "../ddexe" }
mtlmt = { path = "../mtlmt" }
mtarc = { path = "../mtarc" }
mtxfs = { path = "../mtxfs" }
mtlot = { path = "../mtlot" }
mtmod = { path = "../mtmod" }
mtmrl = { path = "../mtmrl" }
mtshader = { path = "../mtshader" }
mtswm = { path = "../mtswm" }
mtweather = { path = "../mtweather" }
ddquest = { path = "../ddquest" }
mttex = { path = "../mttex" }
mtgui = { path = "../mtgui" }
mtgmd = { path = "../mtgmd" }
dddoor = { path = "../dddoor" }
