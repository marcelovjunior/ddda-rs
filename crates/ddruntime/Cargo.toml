[package]
name = "ddruntime"
version = "0.1.0"
description = "Phase 1 runtime: guest memory, image loading and dispatch for the lifted DDDA.exe (docs/RUNTIME.md)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ddnative-base = { path = "../ddnative-base" }
ddnative = { path = "../ddnative", optional = true }
ddexe = { path = "../ddexe" }
d3d9shader = { path = "../d3d9shader" }
d3d9cmd = { path = "../d3d9cmd" }
ddaudio = { path = "../ddaudio" }

[features]
# `game`: the lifted program (ddnative and its ddlift shards). Without it the
# runtime builds and tests its services alone: a session still loads the exe
# and binds every service, and a call into game code stops as untranslated.
default = ["game"]
game = ["dep:ddnative"]

[[example]]
name = "boot"
required-features = ["game"]

[[example]]
name = "call"
required-features = ["game"]

[[example]]
name = "initializers"
required-features = ["game"]

[[example]]
name = "winmain"
required-features = ["game"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_WindowsMediaFormat", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }
windows-core = "0.62.2"

[dev-dependencies]
d3dxref = { path = "../d3dxref" }
mtarc = { path = "../mtarc" }
ddsave = { path = "../ddsave" }
