[package]
name = "ddruntime"
version = "0.1.0"
description = "Phase 1 runtime: guest memory, image loading and dispatch for the lifted DDDA.exe (docs/RUNTIME.md)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 2.1.1 fixes hook ownership and exposes a bounded translation cache; its
# Windows static build does not require the symlink step in later releases.
unicorn-engine = { version = "=2.1.1", default-features = false, features = ["arch_x86"], optional = true }
ddnative-base = { path = "../ddnative-base" }
ddnative-host = { path = "../ddnative-host" }
ddnative = { path = "../ddnative", optional = true }
ddports = { path = "../ddports", optional = true }
# L119: the native path through the nDraw executor port
mtdraw = { path = "../mtdraw" }
mtstate = { path = "../mtstate" }
mtcore = { path = "../mtcore" }
# `crt-check` (L67): only the two shards holding the CRT routines, for
# tests/crtfast.rs against their lifted originals without building all 32
ddlift-05 = { path = "../ddlift/lift_05", optional = true }
ddlift-06 = { path = "../ddlift/lift_06", optional = true }
ddexe = { path = "../ddexe" }
d3d9shader = { path = "../d3d9shader" }
d3d9cmd = { path = "../d3d9cmd" }
d3d9frame = { path = "../d3d9frame" }
ddaudio = { path = "../ddaudio" }
hostdisplay = { path = "../hostdisplay" }

[features]
# `game`: the lifted program (ddnative and its ddlift shards). Without it the
# runtime builds and tests its services alone: a session still loads the exe
# and binds every service, and a call into game code stops as untranslated.
default = ["game"]
game = ["dep:ddnative", "dep:ddports"]
# L172 proof builds only: leaves the ordinary lifted-call hot path unchanged.
# L190: guest threads get a stack window (ddnative-base feature stack-window).
stack-window = ["ddnative-base/stack-window"]
parallel-shadow = ["ddnative-base/private-replay", "ddnative-host/private-replay"]
crt-check = ["dep:ddlift-05", "dep:ddlift-06"]
# `emu`: the diagnostic emulator fallback for untranslated functions
# (src/emu.rs, L51; also needs DDRUNTIME_EMU_FALLBACK=1 at run time).
# Builds Unicorn's C sources, so CMake must be on PATH (VS Build Tools has it).
emu = ["dep:unicorn-engine"]

[[example]]
name = "boot"
required-features = ["game"]

[[example]]
name = "call"
required-features = ["game"]

[[example]]
name = "initializers"
required-features = ["game"]

[[example]]
name = "winmain"
required-features = ["game"]

[[example]]
name = "shadow_replay"
required-features = ["game", "parallel-shadow"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_WindowsMediaFormat", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }
windows-core = "0.62.2"

[dev-dependencies]
d3dxref = { path = "../d3dxref" }
mtarc = { path = "../mtarc" }
ddsave = { path = "../ddsave" }
