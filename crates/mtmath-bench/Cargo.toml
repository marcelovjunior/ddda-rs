[package]
name = "mtmath-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Micro-benchmark of the readable math ports against the lifted bodies they
# replace (docs/MATH.md, "Performance"). Builds three shards; run with
#   cargo run --release -p mtmath-bench
[dependencies]
ddnative-base = { path = "../ddnative-base" }
mtmath = { path = "../mtmath" }
ddlift-07 = { path = "../ddlift/lift_07" }
ddlift-12 = { path = "../ddlift/lift_12" }
ddlift-13 = { path = "../ddlift/lift_13" }
