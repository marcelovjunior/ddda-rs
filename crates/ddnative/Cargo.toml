[package]
name = "ddnative"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dev-dependencies]
serde_json = "1"

[lib]
# Unit tests are in tests/units.rs, avoiding a second facade compilation.
# The generated shard libraries also disable their lib test targets.
test = false

